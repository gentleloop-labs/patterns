# Xcode project for the native Patterns app. Generate with:
#   cd apple && xcodegen generate
# The .xcodeproj is generated; edit this file instead.
name: Patterns
options:
  bundleIdPrefix: com.maskedsyntax
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  PatternsCore:
    path: Packages/PatternsCore

settings:
  base:
    DEVELOPMENT_TEAM: GVGJLY2H53
    SWIFT_VERSION: "6.0"
    # Same App Store record as the Flutter app. 2.0.0 is the native release;
    # the build number continues above the last Flutter build (62).
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "100"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Patterns:
    type: application
    platform: iOS
    sources:
      - path: Patterns
        excludes:
          - "**/*.md"
          - Info.plist
      # Copy comes from Flutter's ARB files, shared with Android.
      - path: ../lib/l10n/app_en.arb
        buildPhase: resources
      - path: ../lib/l10n/app_de.arb
        buildPhase: resources
      - path: ../lib/l10n/app_es.arb
        buildPhase: resources
      - path: ../lib/l10n/app_fr.arb
        buildPhase: resources
      - path: ../lib/l10n/app_ja.arb
        buildPhase: resources
      - path: ../lib/l10n/app_pt.arb
        buildPhase: resources
      - path: ../lib/l10n/app_pt_BR.arb
        buildPhase: resources
    dependencies:
      - package: PatternsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maskedsyntax.patterns
        PRODUCT_NAME: Patterns
        INFOPLIST_FILE: Patterns/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      storeKitConfiguration: Patterns.storekit
      testTargets:
        - PatternsAppTests
        - PatternsUITests

  PatternsAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PatternsAppTests
      - path: Patterns.storekit
        buildPhase: resources
    dependencies:
      - target: Patterns
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maskedsyntax.patterns.AppTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Patterns.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Patterns"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Accessibility audit: walks every screen with Xcode's audit in light,
  # dark and large text. Run against a simulator that holds seeded data.
  PatternsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PatternsUITests
    dependencies:
      - target: Patterns
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maskedsyntax.patterns.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Patterns
