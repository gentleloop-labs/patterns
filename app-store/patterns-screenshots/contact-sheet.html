<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Patterns screenshot contact sheet</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 42px;
      background: #0b0b0a;
      color: #f4f0e8;
      font-family: Arial, sans-serif;
    }
    h1 { margin: 0 0 32px; font-size: 30px; }
    h2 { margin: 34px 0 16px; color: #f4c95d; font-size: 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 14px;
    }
    figure { margin: 0; }
    img {
      display: block;
      width: 100%;
      border: 1px solid #343434;
      border-radius: 8px;
    }
    figcaption {
      margin-top: 8px;
      color: #a9a39a;
      font-size: 11px;
      text-align: center;
    }
    .feature {
      width: 680px;
    }
  </style>
</head>
<body>
  <h1>Patterns store campaign</h1>
  <h2>Apple · 1290×2796</h2>
  <div class="grid" id="apple"></div>
  <h2>Google Play · 1080×1920</h2>
  <div class="grid" id="play"></div>
  <h2>Google Play feature · 1024×500</h2>
  <img class="feature" src="./exports/play-store-feature/patterns-feature-graphic-1024x500.png" alt="" />
  <script>
    const names = [
      "01-when-ocd-feels-urgent",
      "02-delay-the-urge",
      "03-build-your-exposure-ladder",
      "04-see-patterns-not-judgments",
      "05-private-journaling",
      "06-private-by-design",
      "07-patterns-pro",
    ];
    for (const [id, directory] of [
      ["apple", "app-store-1290x2796"],
      ["play", "play-store-1080x1920"],
    ]) {
      document.getElementById(id).innerHTML = names.map((name, index) => `
        <figure>
          <img src="./exports/${directory}/${name}.png" alt="" />
          <figcaption>${index + 1}</figcaption>
        </figure>
      `).join("");
    }
  </script>
</body>
</html>
