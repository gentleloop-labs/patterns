<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Apply the saved theme, or the system setting, before first paint so a
         light-mode visitor never sees a flash of the dark theme. -->
    <script>
      (function () {
        var t;
        try {
          t = localStorage.getItem('patterns-theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts loaded off the critical path: preload the stylesheet, then flip it
         from media="print" to "all" once it arrives so it never blocks first paint.
         Only the weights/styles actually used are requested (no unused italics). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap"
      />
    </noscript>
    <link rel="icon" type="image/png" sizes="64x64" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <meta name="apple-itunes-app" content="app-id=6762611172, app-argument=https://patternsocd.com/" />
    <!-- Analytics deferred to the browser idle callback so it never competes with
         content for the main thread during initial load. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      (function () {
        var loaded = false;
        var loadAnalytics = function () {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-CGS962TNLY';
          document.head.appendChild(s);
          gtag('js', new Date());
          gtag('config', 'G-CGS962TNLY');
        };
        // Ad landing pages call this to pull the load forward: a store tap can
        // happen before idle, and a same-tab navigation would discard the
        // queued event along with the page.
        window.__loadPatternsAnalytics = loadAnalytics;
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadAnalytics, { timeout: 4000 });
        } else {
          window.addEventListener('load', loadAnalytics);
        }
      })();
    </script>
    <link
      rel="alternate"
      type="application/rss+xml"
      title="The Patterns Blog"
      href="/rss.xml"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
